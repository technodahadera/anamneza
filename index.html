<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<style>
:root{--bg:#071826;--surface:#102b3e;--surface2:#14344a;--border:#305568;--ink:#effbff;--muted:#a9c5d3;--mint:#4af5c5;--blue:#6e9fff;--gold:#ffd089;--ok:#84e6ac;--danger:#ffaaaa}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 5% 5%,#16345d,transparent 52%),radial-gradient(ellipse at 95% 90%,#123f49,transparent 52%),var(--bg);color:var(--ink);font:16px/1.55 'Rubik',Arial,sans-serif}
body,button,input{font-family:'Rubik',Arial,sans-serif}button{cursor:pointer;font-weight:700;border:0;font-size:15px;transition:.16s ease}button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.44}
.container{width:min(1480px,calc(100% - 34px));margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0 22px}
.logo{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;letter-spacing:-1px}.logo b{color:var(--mint)}
.med-symbol{display:grid;place-items:center;background:#163e4d;border:1px solid #32788c;width:47px;height:47px;border-radius:15px;font-size:26px}
.micro{font-size:12px;color:var(--muted);font-weight:500}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #3b687a;background:#15384a;color:#c6f9f7;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700}
main{padding-bottom:40px}.card{background:linear-gradient(145deg,#113248ed,#0e2639f5);border:1px solid var(--border);border-radius:24px;padding:25px;box-shadow:0 16px 35px #0002}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4.5vw,67px);line-height:1.17;letter-spacing:-1.7px}h2{font-size:clamp(21px,2.3vw,32px);line-height:1.3}h3{font-size:20px}.muted{color:var(--muted)}
.hero{padding:66px min(7vw,90px);text-align:center;max-width:950px;margin:25px auto;border:2px solid #397081}
.hero h1{margin:16px 0 13px}.hero p{font-size:18px;color:var(--muted);max-width:580px;margin:0 auto 25px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{min-height:49px;padding:12px 22px;border-radius:14px;background:#25485c;color:white;border:1px solid #487386;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.primary{background:linear-gradient(110deg,#50f4c7,#90b6ff);color:#062134;border:none}
.btn.ghost{background:transparent}.btn.current{background:#124f5e;border-color:var(--mint);color:#a7fffa}
.btn.tiny{font-size:13px;min-height:37px;padding:8px 13px}.btn.large{font-size:18px;min-height:58px;padding:13px 24px}
.btn.block{width:100%} .btn:hover:not(:disabled){filter:brightness(1.1)}
.grid{display:grid;gap:18px}.grid2{grid-template-columns:minmax(0,1.5fr) minmax(290px,.78fr)}
.teacher-panels{grid-template-columns:minmax(0,1fr) minmax(325px,.78fr)}
.case-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 17px}.case-tabs .btn{flex:1}
.phase-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.phase-tabs button{flex:1}
.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.teacher-pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{display:block;direction:ltr;font-size:clamp(38px,4.6vw,67px);font-weight:900;letter-spacing:10px;color:var(--mint);font-variant-numeric:tabular-nums;margin:2px 0 7px;line-height:1.1}
.row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.label{font-size:13px;font-weight:800;color:var(--mint);letter-spacing:.3px}
.viewer{border:1px solid #396477;background:#071520;border-radius:18px;overflow:hidden;aspect-ratio:16/9}
.viewer video{display:block;width:100%;height:100%;object-fit:contain}
.poster{height:100%;display:grid;place-items:center;text-align:center;background:linear-gradient(120deg,#0e3b4d,#123d53);font-size:48px}
.presenter{margin:16px 0 0;padding:17px;border-radius:15px;border:1px solid #36596b;background:#0c2b3d}
.presenter h3{margin:9px 0}.hint{color:#acc7d3;font-size:13px}
.qr-wrap{background:white;padding:12px;border-radius:15px;display:inline-flex;justify-content:center;align-items:center;width:186px;height:186px;color:#071826}
.invite-panel{display:grid;grid-template-columns:1fr 185px;gap:22px;align-items:center}
.invite-panel p{max-width:380px}.invite-link{word-break:break-all;direction:ltr;font-size:12px;color:#b6ddeb;max-width:390px;text-align:right}
.counter{font-size:35px;color:var(--mint);font-weight:900;font-variant-numeric:tabular-nums}
.stats{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0 8px}.stat{background:#0b293b;border:1px solid #28596d;padding:13px 18px;border-radius:15px;flex:1;min-width:130px}
.bar-stack{display:grid;gap:16px;margin:19px 0}
.answer-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:13px 15px;background:#0d2b3c;border:1px solid #2a5062;border-radius:15px}
.answer-title{font-size:17px;font-weight:700;line-height:1.45}.answer-num{font-weight:900;font-size:22px;color:#e2faf9;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-track{height:12px;background:#224558;border-radius:99px;overflow:hidden;grid-column:1/-1}
.bar-fill{height:100%;background:linear-gradient(90deg,#13beba,#6ac8fa);border-radius:99px;min-width:0}
.teacher-note{background:#193c47;border-right:4px solid var(--gold);padding:14px;border-radius:10px;color:#d0e8e7;margin-top:12px}
.mobile-card{width:min(610px,100%);margin:15px auto;padding:29px}.phone-option{width:100%;text-align:right;display:flex;gap:13px;align-items:center;padding:17px 17px;margin:11px 0;background:#13364a;color:#fff;border:2px solid #3c6070;border-radius:15px;min-height:66px;line-height:1.45;font-size:16px}
.phone-option .circle{width:27px;height:27px;border-radius:50%;border:2px solid #7296a6;display:inline-grid;place-items:center;flex:none;font-size:14px}
.phone-option.selected{border-color:var(--mint);background:#164b52}.phone-option.selected .circle{color:#073137;background:var(--mint);border-color:var(--mint)}
.phone-option:hover{border-color:#82cfe3}.instruction{background:#0b2c3c;padding:14px 17px;border-radius:12px;border:1px solid #2e6270;color:#c8e3e8;font-size:14px;margin:18px 0}
.saved{background:#173e43;border:1px solid #439d8c;color:#b7fbe4;padding:14px 18px;border-radius:13px;font-weight:700}
.input{width:100%;font-size:28px;letter-spacing:7px;text-align:center;direction:ltr;color:var(--ink);background:#0d2739;border:1px solid #4a8090;border-radius:13px;padding:15px;outline:none}
.line{border:0;border-top:1px solid #305468;margin:22px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffc277;margin-left:6px}
.dot.good{background:var(--ok)}.foot{text-align:center;font-size:12px;color:#86a6b4;padding:19px 10px 32px}
.error{color:#ffc0c0}.big-wait{text-align:center;padding:65px 16px 55px}.big-wait .bubble{font-size:66px;margin-bottom:10px}
.summary{font-size:13px;color:#a8d9da}.empty{font-size:15px;color:var(--muted);padding:22px;text-align:center;border:1px dashed #476979;border-radius:15px}
#message{position:fixed;bottom:20px;left:15px;right:15px;max-width:520px;margin:auto;padding:14px 20px;background:#164352;border:1px solid var(--mint);border-radius:14px;color:#f3ffff;box-shadow:0 12px 35px #0006;text-align:center;z-index:20}
[hidden]{display:none!important}
@media(min-width:1120px){.teacher-screen .container{width:min(1600px,calc(100% - 56px))}.teacher-screen h3{font-size:23px}}
@media(max-width:900px){.grid2,.teacher-panels{grid-template-columns:1fr}.invite-panel{grid-template-columns:1fr}.qr-wrap{margin:auto}.case-tabs,.phase-tabs{flex-wrap:wrap}.case-tabs .btn,.phase-tabs .btn{flex:auto}}
@media(max-width:580px){.container{width:calc(100% - 22px)}header{padding:16px 0}.logo{font-size:20px}.med-symbol{width:38px;height:38px;font-size:19px}.card{padding:17px;border-radius:18px}.hero{padding:38px 18px}.hero h1{font-size:36px}.hero p{font-size:15px}.btn.large{font-size:16px}.mobile-card{padding:19px}.code{font-size:38px;letter-spacing:6px}.topline{align-items:flex-start}.teacher-pills{gap:6px}.phone-option{font-size:15px}.stat{min-width:110px;padding:10px}}
</style>
<style>
.status-ribbon{font-weight:700;display:inline-flex;gap:8px;align-items:center;border:1px solid #396674;background:#174454;border-radius:999px;padding:7px 14px;color:#ddf5f0}
.status-ribbon.ok{border-color:#52b9a6;background:#153f38;color:#b7f6e4}.status-ribbon.bad{border-color:#d7886b;background:#4c2929;color:#ffe3d4}
.notice-big{background:#193e4c;border-right:4px solid #fed58e;border-radius:14px;padding:18px;line-height:1.7}
.teachershow{background:#fff0be;color:#163849;font-size:13px;font-weight:800;border-radius:8px;padding:4px 9px}
.loading-circle{width:28px;height:28px;border-radius:50%;border:3px solid #5ac4b0;border-right-color:transparent;display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.join-error{color:#ffccbd;font-weight:700;padding:14px;border:1px solid #faab8c;border-radius:12px;margin:16px 0}
</style>
</head><body>
<div class="container">
<header><div class="logo"><span class="med-symbol">🩺</span><span>חדר מיון <b>LIVE</b><div class="micro">המורה מציג · הכיתה בוחרת · רואים את ההתפלגות</div></span></div><span class="pill" style="border-color:#4af5c5;color:#4af5c5">גרסה 3.0 · חיבור חי חדש</span></header>
<main id="app" aria-live="polite"></main>
<div class="foot">טכנודע · סימולציה פדגוגית של מקרים בדויים בלבד · בלי שמות תלמידים, בלי נתונים רפואיים אישיים · משתמש בשירות ntfy.sh להצבעה אנונימית</div>
</div><div id="message" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
// TECHNODA MEDLIVE V3 - 2026-11-01. One static index.html for GitHub Pages.
// Public relay (ntfy.sh) for anonymous classroom votes. No PeerJS, no database account.
const CASES = [{"id":"maya","name":"מאיה","age":13,"subtitle":"תיק 01","title":"קשיי נשימה לאחר ריצה","video":"https://res.cloudinary.com/gstuiyt9/video/upload/v1793520502/%D7%9E%D7%A7%D7%A8%D7%94_%D7%9E%D7%90%D7%99%D7%94.mp4","question":{"title":"איזו שאלה הייתם שואלים את מאיה קודם?","options":["האם את מצליחה לדבר במשפטים שלמים ולנשום גם במנוחה?","האם הרגשת קושי דומה בעבר?","האם יש משהו מסוים שמחמיר את התחושה?","האם את נוטלת תרופות או משתמשת במשאף?"]},"metrics":{"title":"אילו שני מדדים הייתם בוחרים לבדוק קודם?","options":["סטורציה (ריווי חמצן)","קצב הנשימה","דופק","לחץ דם","חום גוף","רפלקסים"]},"note":"בקשיי נשימה חשוב להעריך תחילה את חומרת המצוקה. קצב נשימה, סטורציה ודופק יכולים לסייע, אך אינם קובעים לבדם אבחנה. אם יש קושי ניכר בדיבור או בנשימה, נדרשת הערכה רפואית דחופה."},{"id":"noam","name":"נועם","age":14,"subtitle":"תיק 02","title":"סחרחורת לאחר פעילות בשמש","video":"https://res.cloudinary.com/gstuiyt9/video/upload/v1793520502/%D7%9E%D7%A7%D7%A8%D7%94_%D7%A0%D7%95%D7%A2%D7%9D.mp4","question":{"title":"איזו שאלה הייתם שואלים את נועם קודם?","options":["האם איבדת הכרה, נפלת או נפגעת בראש?","כמה מים שתית היום?","מתי אכלת לאחרונה?","האם הרגשת סחרחורת דומה בעבר?"]},"metrics":{"title":"אילו שני מדדים הייתם בוחרים לבדוק קודם?","options":["דופק","לחץ דם","חום גוף","סטורציה (ריווי חמצן)","קצב הנשימה","רפלקסים"]},"note":"בסחרחורת אחרי מאמץ יש לברר תחילה עילפון, חבלה וסימני אזהרה. מדדים יכולים להוסיף מידע, לצד שאלות על שתייה, אכילה וחשיפה לחום. אין להסיק שהתייבשות היא בהכרח הסיבה."},{"id":"tamar","name":"תמר","age":13,"subtitle":"תיק 03","title":"חום וכאב גרון","video":"https://res.cloudinary.com/gstuiyt9/video/upload/v1793518406/%D7%9E%D7%A7%D7%A8%D7%94_%D7%AA%D7%9E%D7%A8.mp4","question":{"title":"איזו שאלה הייתם שואלים את תמר קודם?","options":["האם את מצליחה לבלוע רוק ולנשום כרגיל?","מתי בדיוק התחיל כאב הגרון?","האם מופיע גם שיעול?","האם היו אנשים חולים בסביבתך?"]},"metrics":{"title":"אילו שני מדדים הייתם בוחרים לבדוק קודם?","options":["חום גוף","דופק","סטורציה (ריווי חמצן)","קצב הנשימה","לחץ דם","רפלקסים"]},"note":"כאב גרון וחום דורשים בירור, ובפרט חשוב לזהות קושי בנשימה או בבליעת רוק כסימני אזהרה. חום, דופק ומדדים נוספים מתארים את המצב, אך אינם מבחינים לבדם בין הגורמים האפשריים."}];

const MODE={VIDEO:'video',QUESTION:'question',METRICS:'metrics'};
const app=document.getElementById('app');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choiceLetters='אבגדהוזחט';
let role='home',room='',session='',stage={caseIndex:0,phase:MODE.VIDEO,round:'0:video'};
let es=null,healthTimer=null,connectionState='connecting',lastState=0,joinVerified=false;
let people=new Map(),votes=new Map(),myVote=[],mySent=null,myStage='',myId='';
const topic=(code)=>`https://ntfy.sh/technoda-medlive-2026-${code}`;
const classUrl=()=>location.origin+location.pathname+'?room='+room+'&v=3';
const currentCase=()=>CASES[stage.caseIndex];
const curQuestion=()=>currentCase()[stage.phase];
const currentRound=()=>`${stage.caseIndex}:${stage.phase}`;
const randomDigits=()=>String(100000+Math.floor(Math.random()*900000));
const uuid=()=>window.crypto?.randomUUID?.()||`${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
const milliseconds=()=>Date.now();
function toast(message){const n=document.getElementById('message');n.hidden=false;n.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.hidden=true,4800)}
function cleanup(){try{es?.close()}catch(e){}if(healthTimer)clearInterval(healthTimer);es=null;healthTimer=null;role='home';people.clear();votes.clear();lastState=0;joinVerified=false;}
async function send(message){
 const result=await fetch(topic(room),{method:'POST',body:JSON.stringify({...message,app:'technoda-medlive-v3',room,t:milliseconds()}),cache:'no-store'});
 if(!result.ok)throw new Error('HTTP '+result.status);
 return true;
}
function listen(onMessage,onOpen,onError,history='90s'){
 const stream=new EventSource(topic(room)+'/sse?since='+history);
 stream.onopen=()=>onOpen?.();
 stream.onmessage=e=>{try{const env=JSON.parse(e.data);if(env.event!=='message')return;const m=JSON.parse(env.message);if(m.app==='technoda-medlive-v3'&&m.room===room&&Math.abs(milliseconds()-m.t)<150000)onMessage(m)}catch(err){}};
 stream.onerror=()=>onError?.();
 return stream;
}
function hero(){cleanup();document.body.classList.remove('teacher-screen');app.innerHTML=`<section class="card hero">
 <span class="pill">חדש · גרסה 3.0 · חיבור ללא PeerJS</span><h1>חדר מיון <span style="color:var(--mint)">LIVE</span></h1>
 <p>המורה מציג סרטון ושאלה. כל תלמיד בוחר בטלפון שאלה או שני מדדים. מסך המורה מציג מיד כמה בחרו בכל אפשרות.</p>
 <div class="actions"><button class="btn primary large" id="teacherEnter">🖥️ מסך המורה</button><button class="btn large" id="studentEnter">📱 מסך התלמיד</button></div>
 <div class="instruction" style="margin-top:30px">בלי ניקוד ובלי הרשמה. נדרשת גישה לאינטרנט בשני המכשירים.</div></section>`;
 document.getElementById('teacherEnter').onclick=startTeacher;
 document.getElementById('studentEnter').onclick=()=>joinForm();
}
function joinForm(preset=''){
 cleanup();role='join';document.body.classList.remove('teacher-screen');room=preset;
 app.innerHTML=`<section class="card mobile-card"><span class="pill">📱 מסך תלמיד · 3.0</span><h2>התחברות לשיעור</h2>
 <p class="muted">סרקתם את הברקוד? הקוד כבר רשום כאן. לחצו על "כניסה לחדר".</p><label class="label" for="code">קוד החדר</label>
 <input id="code" class="input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" value="${safe(preset)}">
 <button class="btn primary block large" id="enter" style="margin-top:18px">כניסה לחדר</button>
 <div id="joinInfo" class="instruction">המורה צריך להשאיר את מסך החדר פתוח ולהראות את המילה ״מחובר״.</div>
 <button class="btn ghost tiny" id="back" style="margin-top:14px">חזרה</button></section>`;
 document.getElementById('enter').onclick=()=>startStudent(document.getElementById('code').value.trim());
 document.getElementById('back').onclick=hero;
 document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')startStudent(e.target.value.trim())});
}
function setTeacherStatus(value,text){connectionState=value;const el=document.getElementById('relay-status');if(el){el.textContent=text;el.className='status-ribbon '+(value==='ok'?'ok':value==='bad'?'bad':'')}}
async function announce(){if(role!=='teacher'||!room)return;await send({type:'state',session,caseIndex:stage.caseIndex,phase:stage.phase,round:currentRound()})}
function startTeacher(){
 cleanup();role='teacher';document.body.classList.add('teacher-screen');room=randomDigits();session=uuid();stage={caseIndex:0,phase:MODE.VIDEO};
 app.innerHTML='<section class="card hero"><div class="loading-circle"></div><h2>מחברים את מסך המורה...</h2><p class="muted">נא לא לסרוק לפני הופעת קוד החדר.</p></section>';
 es=listen(m=>{
  if(m.session!==session)return;
  if(m.type==='hello'&&typeof m.id==='string'&&m.id.length<90){people.set(m.id,milliseconds());refreshBars()}
  if(m.type==='vote'&&m.round===currentRound()&&typeof m.id==='string'&&m.id.length<90){
    const opts=curQuestion()?.options||[];
    if(!Array.isArray(m.values)||m.values.length!==(stage.phase===MODE.METRICS?2:1))return;
    if(!m.values.every(v=>Number.isInteger(v)&&v>=0&&v<opts.length)||new Set(m.values).size!==m.values.length)return;
    people.set(m.id,milliseconds());votes.set(m.id,m.values);refreshBars();
  }
 },async()=>{
    if(role!=='teacher')return;
    setTeacherStatus('ok','🟢 מחובר · אפשר לסרוק');
    try{await announce()}catch(e){setTeacherStatus('bad','🔴 תקלה בפרסום החדר');toast('שירות ההצבעה לא מגיב. בדקו אינטרנט והאם ntfy.sh זמין.')}
    if(!document.getElementById('teacherMain'))renderTeacher();
 },()=>{if(role==='teacher')setTeacherStatus('bad','🔴 אין חיבור לשירות ההצבעה')},'30s');
 // Periodically refresh the classroom state; allows students joining late to find an active room.
 healthTimer=setInterval(async()=>{if(role!=='teacher'||connectionState!=='ok')return;try{await announce()}catch(e){setTeacherStatus('bad','🔴 אין חיבור לשירות ההצבעה')}},25000);
}
function setCase(i){if(i===stage.caseIndex)return;stage={caseIndex:i,phase:MODE.VIDEO};votes.clear();renderTeacher();announce().catch(()=>toast('לא הצלחנו לעדכן את שלב התלמידים'))}
function setPhase(p){if(stage.phase===p)return;stage.phase=p;votes.clear();renderTeacher();announce().catch(()=>toast('לא הצלחנו לעדכן את שלב התלמידים'))}
function renderTeacher(){
 const c=currentCase(),isVideo=stage.phase===MODE.VIDEO,question=isVideo?null:curQuestion();
 app.innerHTML=`<section id="teacherMain"><div class="topline"><div class="row">
 <span class="pill">🖥️ מורה · גרסה 3.0</span> <span id="relay-status" class="status-ribbon ${connectionState==='ok'?'ok':'bad'}">${connectionState==='ok'?'🟢 מחובר · אפשר לסרוק':'🔴 אין חיבור לשירות ההצבעה'}</span>
 </div><div class="row"><button class="btn primary tiny" id="next">▶ לשלב הבא</button><button class="btn tiny ghost" id="full">⛶ מסך מלא</button><button class="btn tiny ghost" id="restart">חדר חדש</button></div></div>
 <div class="grid teacher-panels"><section class="card"><div class="label">בחרו את המטופל</div>
 <div class="case-tabs" style="margin:10px 0 18px">${CASES.map((a,i)=>`<button class="btn ${i===stage.caseIndex?'current':''}" data-case="${i}">${safe(a.name)}</button>`).join('')}</div>
 <div class="label">מה מציגים לכיתה?</div><div class="phase-tabs" style="margin:10px 0 18px">
 <button class="btn ${isVideo?'current':''}" data-phase="video">🎬 סרטון</button>
 <button class="btn ${stage.phase===MODE.QUESTION?'current':''}" data-phase="question">❓ מה נשאל?</button>
 <button class="btn ${stage.phase===MODE.METRICS?'current':''}" data-phase="metrics">🩺 מה נמדוד?</button></div>
 ${isVideo?`<div class="viewer"><video controls playsinline preload="metadata" src="${safe(c.video)}"></video></div>
 <h2>${safe(c.name)}, בן/בת ${c.age}</h2><div class="instruction">הציגו את הסרטון לכיתה. לאחריו לחצו על ״מה נשאל?״ כדי להתחיל בהצבעה.</div>`:
 `<h2>${safe(question.title)}</h2><p class="muted">${stage.phase===MODE.METRICS?'כל תלמיד בוחר בדיוק שני מדדים':'כל תלמיד בוחר אפשרות אחת'}</p>
 <div class="stats"><div class="stat"><div class="micro">הצטרפו לחדר</div><div id="people" class="counter">0</div></div>
 <div class="stat"><div class="micro">ענו לשאלה</div><div id="voted" class="counter">0</div></div></div>
 <div id="teacherBars"></div><details style="margin-top:15px"><summary>💡 דגש לדיון</summary><div class="teacher-note">${safe(c.note)}</div></details>`}</section>
 <aside class="card"><div class="label">התלמידים נכנסים לטלפון</div><h3>קוד חדר</h3><span class="code">${room}</span>
 <div class="invite-panel"><div><p class="muted">סרקו את הקוד או הקלידו את קוד החדר באותו אתר.</p><p class="invite-link">${safe(classUrl())}</p>
 <button class="btn tiny" id="copy">העתקת קישור</button></div><div class="qr-wrap" id="qrcode"></div></div>
 <hr class="line"><p class="muted">ודאו שהחיווי למעלה ירוק. השאירו את לשונית המורה פתוחה בזמן התשובות.</p><div class="instruction">ההתפלגות על המסך מתעדכנת אוטומטית. אין צורך לחשוף תשובות נכונות.</div></aside></div></section>`;
 document.querySelectorAll('[data-case]').forEach(e=>e.onclick=()=>setCase(Number(e.dataset.case)));
 document.querySelectorAll('[data-phase]').forEach(e=>e.onclick=()=>setPhase(e.dataset.phase));
 document.getElementById('next').onclick=()=>{if(stage.phase===MODE.VIDEO)setPhase(MODE.QUESTION);else if(stage.phase===MODE.QUESTION)setPhase(MODE.METRICS);else if(stage.caseIndex<2)setCase(stage.caseIndex+1);else toast('סיימתם את שלושת המקרים')};
 document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
 document.getElementById('restart').onclick=()=>{if(confirm('חדר חדש יסגור את ההצבעה הנוכחית. להמשיך?'))startTeacher()};
 document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(classUrl()).then(()=>toast('הקישור הועתק')).catch(()=>toast('העתיקו את הקישור ידנית'));
 const qr=document.getElementById('qrcode');if(window.QRCode){new QRCode(qr,{text:classUrl(),width:160,height:160,colorDark:'#092236',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}else qr.textContent=room;
 refreshBars();
}
function refreshBars(){if(role!=='teacher')return;
 const p=document.getElementById('people');if(p)p.textContent=people.size;
 const v=document.getElementById('voted');if(v)v.textContent=votes.size;
 const el=document.getElementById('teacherBars');if(!el)return;
 if(!votes.size){el.innerHTML='<div class="empty">עדיין אין תשובות. בחרו תשובה מהטלפון והעמודות יופיעו כאן.</div>';return}
 const q=curQuestion(),n=votes.size;
 el.innerHTML=`<p class="micro">${n} תלמידים ענו ${stage.phase===MODE.METRICS?'· כל תלמיד בחר שני מדדים':''}</p><div class="bar-stack">${q.options.map((opt,i)=>{
  const count=[...votes.values()].filter(arr=>arr.includes(i)).length,pct=Math.round(count/n*100);
  return `<div class="answer-card"><div class="answer-title">${safe(opt)}</div><div class="answer-num">${count} <small>(${pct}%)</small></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`
 }).join('')}</div>`;
}
function startStudent(value){
 if(!/^\d{6}$/.test(value)){toast('הקוד חייב להכיל שש ספרות');return}
 cleanup();role='join';room=value;myId=sessionStorage.getItem('technoda-med-v3-id')||uuid();sessionStorage.setItem('technoda-med-v3-id',myId);
 app.innerHTML=`<section class="card mobile-card big-wait"><div class="loading-circle"></div><h2>מחפשים את חדר ${safe(value)}...</h2><p id="waitmsg" class="muted">מתחברים לשירות ההצבעה ובודקים שמסך המורה פעיל.</p><button id="tryAgain" class="btn tiny ghost">חזרה והקלדת קוד</button></section>`;
 document.getElementById('tryAgain').onclick=()=>joinForm(room);
 let joined=false;
 es=listen(async m=>{
  if(m.type!=='state'||typeof m.session!=='string'||milliseconds()-m.t>60000)return;
  if(!joined){
   session=m.session;joined=true;joinVerified=true;
   try{await send({type:'hello',session,id:myId})}catch(e){joined=false;joinVerified=false;const el=document.getElementById('waitmsg');if(el)el.textContent='החדר אותר, אבל לא ניתן לשלוח אליו תשובות. בדקו את האינטרנט ונסו שוב.';return}
  }
  if(m.session!==session)return;
  const nr=`${m.caseIndex}:${m.phase}`;
  if(nr!==myStage){myStage=nr;myVote=[];mySent=null;}
  if(!Number.isInteger(m.caseIndex)||m.caseIndex<0||m.caseIndex>=CASES.length||!Object.values(MODE).includes(m.phase))return;
  stage={caseIndex:m.caseIndex,phase:m.phase};role='student';renderStudent();
 },()=>{const e=document.getElementById('waitmsg');if(e)e.textContent='מחפשים הודעה ממסך המורה. יש להשאיר את המסך פתוח.'},()=>{
  const e=document.getElementById('waitmsg');if(e)e.textContent='אין חיבור לשירות ההצבעה. נסו לעבור מרשת Wi-Fi לגלישה סלולרית.';
 },'65s');
 // Students should not be told "room not found" if the connection has not been confirmed yet.
 setTimeout(()=>{if(role==='join'&&!joined){const e=document.getElementById('waitmsg');if(e)e.innerHTML='עדיין לא התקבלה הודעה מהמורה. בדקו שהמורה נמצא ב<strong>גרסה 3.0</strong>, שהחיווי שלו <strong>ירוק</strong> ושהקוד זהה.'}},12000);
}
function renderStudent(){
 document.body.classList.remove('teacher-screen');const c=currentCase(),isVideo=stage.phase===MODE.VIDEO;
 if(isVideo){app.innerHTML=`<section class="card mobile-card big-wait"><span class="pill">🟢 מחוברים · חדר ${room}</span><div class="bubble">🎬</div><h2>צפו בסרטון על מסך המורה</h2><p class="muted">${safe(c.name)} מציג/ה את המקרה. השאלה תופיע כאן כשמסך המורה יעבור לשלב הבא.</p></section>`;return}
 const q=curQuestion(),two=stage.phase===MODE.METRICS;
 app.innerHTML=`<section class="card mobile-card"><span class="pill">🟢 מחוברים · חדר ${room}</span>
 <h2>${safe(q.title)}</h2><div class="instruction">${two?'בחרו שני מדדים ולאחר מכן לחצו ״שליחה״':'בחרו שאלה אחת. הבחירה נשלחת בלחיצה.'}</div>
 <div id="options">${q.options.map((opt,i)=>`<button class="phone-option ${myVote.includes(i)?'selected':''}" data-option="${i}"><span class="circle">${myVote.includes(i)?'✓':choiceLetters[i]}</span><span>${safe(opt)}</span></button>`).join('')}</div>
 ${two?`<button class="btn primary block large" id="submit" ${myVote.length!==2?'disabled':''}>שליחת שני המדדים</button>`:'<p class="micro muted">אפשר לשנות את הבחירה.</p>'}
 <div class="saved" id="result" ${mySent?'':'hidden'}>✓ הבחירה נשלחה ונקלטת במסך המורה.</div></section>`;
 document.querySelectorAll('[data-option]').forEach(btn=>btn.onclick=()=>{
  const i=Number(btn.dataset.option);
  if(!two){myVote=[i];mySent=null;renderStudent();submitVote();return}
  if(myVote.includes(i))myVote=myVote.filter(x=>x!==i);
  else if(myVote.length<2)myVote.push(i);else{toast('אפשר לבחור שני מדדים בלבד');return}
  mySent=null;renderStudent();
 });
 const sendBtn=document.getElementById('submit');if(sendBtn)sendBtn.onclick=submitVote;
}
async function submitVote(){
 if(!joinVerified||!session){toast('אין חיבור לחדר המורה');return}
 const expected=stage.phase===MODE.METRICS?2:1;
 if(myVote.length!==expected)return;
 const round=currentRound();
 try{await send({type:'vote',session,id:myId,round,values:[...myVote]});mySent=[...myVote];if(role==='student'&&currentRound()===round){const e=document.getElementById('result');if(e)e.hidden=false;toast('✓ התשובה נשלחה')}}
 catch(e){toast('שליחת התשובה נכשלה. נסו שוב או בדקו את האינטרנט.')}
}
window.addEventListener('beforeunload',()=>{try{es?.close()}catch(e){}});
window.addEventListener('load',()=>{const params=new URLSearchParams(location.search);if(params.get('teacher')==='1')startTeacher();else if(/^\d{6}$/.test(params.get('room')||''))startStudent(params.get('room'));else hero()});
</script></body></html>
